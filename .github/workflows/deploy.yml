name: Deploy to Production

on:
  push:
    branches: [develop, main]
  workflow_dispatch:  # 수동 실행 버튼도 활성화

jobs:
  # ── 변경된 서비스 감지 ─────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      fastapi: ${{ steps.filter.outputs.fastapi }}
      ai_worker: ${{ steps.filter.outputs.ai_worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 변경된 서비스 감지
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)

          FASTAPI=false
          AI_WORKER=false
          FRONTEND=false

          echo "$CHANGED" | grep -qE "^app/|^alembic/" && FASTAPI=true
          echo "$CHANGED" | grep -qE "^ai_worker/" && AI_WORKER=true
          echo "$CHANGED" | grep -qE "^frontend/" && FRONTEND=true
          # pyproject.toml, uv.lock 변경 시 fastapi + ai-worker 모두 재빌드
          echo "$CHANGED" | grep -qE "^pyproject\.toml|^uv\.lock" && FASTAPI=true && AI_WORKER=true

          ANY=false
          ([ "$FASTAPI" = "true" ] || [ "$AI_WORKER" = "true" ] || [ "$FRONTEND" = "true" ]) && ANY=true

          echo "fastapi=$FASTAPI"   >> $GITHUB_OUTPUT
          echo "ai_worker=$AI_WORKER" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND"  >> $GITHUB_OUTPUT
          echo "any_changed=$ANY"    >> $GITHUB_OUTPUT

          echo "=== 변경 감지 결과 ==="
          echo "fastapi=$FASTAPI, ai_worker=$AI_WORKER, frontend=$FRONTEND"

  # ── 배포 (Required Reviewer 승인 필요) ──────────────────────────────────────
  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    environment: production  # ← GitHub Secrets + Required Reviewer 적용

    steps:
      - uses: actions/checkout@v4

      - name: Docker 로그인
        run: echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 버전 설정 (ga-{run_number})
        run: echo "VERSION=ga-${{ github.run_number }}" >> $GITHUB_ENV

      # ── fastapi 빌드 ─────────────────────────────────────────────────────
      - name: fastapi 이미지 빌드 & 푸시
        if: needs.detect-changes.outputs.fastapi == 'true'
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/ai-health:app-${{ env.VERSION }} \
            -f app/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-health:app-${{ env.VERSION }}
          echo "✅ fastapi 빌드 완료: app-${{ env.VERSION }}"

      # ── ai-worker 빌드 ───────────────────────────────────────────────────
      - name: ai-worker 이미지 빌드 & 푸시
        if: needs.detect-changes.outputs.ai_worker == 'true'
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/ai-health:ai-${{ env.VERSION }} \
            -f ai_worker/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-health:ai-${{ env.VERSION }}
          echo "✅ ai-worker 빌드 완료: ai-${{ env.VERSION }}"

      # ── frontend 빌드 ────────────────────────────────────────────────────
      - name: frontend 이미지 빌드 & 푸시
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            -t ${{ secrets.DOCKER_USERNAME }}/ai-health:frontend-${{ env.VERSION }} \
            -f frontend/Dockerfile frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-health:frontend-${{ env.VERSION }}
          echo "✅ frontend 빌드 완료: frontend-${{ env.VERSION }}"

      # ── EC2 배포 ─────────────────────────────────────────────────────────
      - name: EC2 배포용 .env 파일 준비
        run: |
          printf '%s\n' "${{ secrets.PROD_ENV }}" > .deploy.env
          # 변경된 서비스 버전만 업데이트
          if [ "${{ needs.detect-changes.outputs.fastapi }}" = "true" ]; then
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${{ env.VERSION }}/" .deploy.env
          fi
          if [ "${{ needs.detect-changes.outputs.ai_worker }}" = "true" ]; then
            sed -i "s/^AI_WORKER_VERSION=.*/AI_WORKER_VERSION=${{ env.VERSION }}/" .deploy.env
          fi
          if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            sed -i "s/^FRONTEND_VERSION=.*/FRONTEND_VERSION=${{ env.VERSION }}/" .deploy.env
          fi

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: EC2에 .env 전송
        run: |
          scp -i ~/.ssh/ec2.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            .deploy.env ubuntu@${{ secrets.EC2_HOST }}:~/project/.env

      - name: EC2 컨테이너 업데이트
        run: |
          SERVICES=""
          [ "${{ needs.detect-changes.outputs.fastapi }}" = "true" ] && SERVICES="$SERVICES fastapi"
          [ "${{ needs.detect-changes.outputs.ai_worker }}" = "true" ] && SERVICES="$SERVICES ai-worker"
          [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ] && SERVICES="$SERVICES frontend"

          ssh -i ~/.ssh/ec2.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ubuntu@${{ secrets.EC2_HOST }} << EOF
            cd project
            echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker compose up -d --pull always --no-deps $SERVICES
            docker image prune -af
            echo "🚀 배포 완료: $SERVICES"
          EOF
