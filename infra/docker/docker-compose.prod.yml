# 도커로 구동해야할 서비스를 정의합니다. 각 서비스는 각각의 컨테이너로 구동됩니다.
services:
  # 0. PostgreSQL (pgvector + PostGIS)
  # MySQL → PostgreSQL로 변경 (이 프로젝트는 PostgreSQL + pgvector 사용)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: always
    environment:
      # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
      # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql  # vector, postgis 확장 활성화 (최초 기동 시에만 실행)
    networks:
      - ws
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis  # 컨테이너의 이름
    networks:  # 도커 네트워크 연결 설정
      - ws
    ports:  # 포트 포워딩 설정
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:  # 해당 컨테이너가 정상적으로 실행되는지 확인하는 헬스체크
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    # 빌드된 이미지를 Docker Hub에서 pull하여 사용 (deployment.sh에서 빌드 & 푸시)
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file: .env
    environment:
      DB_HOST: postgres   # Docker Compose 네트워크 내 컨테이너 이름으로 접근
      REDIS_URL: redis://redis:6379
    # --reload 제거: 프로덕션에서는 핫리로드 불필요
    command: |
      sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ocr_uploads:/tmp/ocr_uploads  # OCR 업로드 파일 영속화
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    # 의존성 옵션입니다. postgres, redis 컨테이너가 정상 실행되었을 때만 이 컨테이너를 실행합니다.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (OCR / Chat / Guide 처리)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    restart: always
    mem_limit: 4G
    volumes:
      - ocr_uploads:/tmp/ocr_uploads  # fastapi와 동일한 볼륨 공유 (OCR 파일 접근)
    networks:
      - ws
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # deployment.sh에서 prod_http.conf 또는 prod_https.conf를 복사
      - certbot-conf:/etc/letsencrypt   # SSL 인증서 저장소 (HTTPS 전환 시 사용)
      - certbot-www:/var/www/certbot    # Let's Encrypt HTTP challenge 파일 경로
    ports:
      - "80:80"
      - "443:443"  # HTTPS 전환 시 사용
    networks:
      - ws
    depends_on:
      - fastapi

  # 6. Frontend (React + Vite)
  frontend:
    container_name: frontend
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:frontend-${FRONTEND_VERSION}
    networks:
      - ws
    depends_on:
      - fastapi

  # 7. certbot (SSL 인증서 자동 갱신 - HTTPS 전환 후 활성화)
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  postgres_data:
    name: postgres_data
  ocr_uploads:
    name: ocr_uploads
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
