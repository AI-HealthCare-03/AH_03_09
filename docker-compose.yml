services:
  # 0. PostgreSQL with PGvector + PostGIS
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: postgres
    environment:
      POSTGRES_USER: medifind
      POSTGRES_PASSWORD: medifind_password
      POSTGRES_DB: medifind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ws
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medifind -d medifind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1. Redis (JWT refresh token 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: app/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file: .env
    command: |
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

networks:
  ws:
    driver: bridge

volumes:
  postgres_data:
